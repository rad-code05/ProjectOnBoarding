<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audit log · Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Raleway:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Raleway,sans-serif;color:#000000;background:#F4F0EA}
a{color:#000000}a:hover{color:#cf2e2e}
input::placeholder{color:#7e7e7e}
</style>
</helmet>
<div style="width: 390px; height: 1560px; display: flex; flex-direction: column; font-family: Raleway, sans-serif; background: #F4F0EA; color: #000000">

<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 16px; background: #000000; display: flex; align-items: center; gap: 12px; color: #FFFFFF">
<img src="/_blob/17b23c9ce6dc5f048942c7b514470f03" alt="Laine" style="width: 60px; height: 22px; display: block; flex-shrink: 0">
<div style="width: 1px; height: 18px; background: #333333; flex-shrink: 0"></div>
<span style="flex-grow: 1; min-width: 0; font-family: Newsreader, serif; font-size: 16px">Onboarding rights</span>
<a href="#" aria-label="My profile: Raju Bholani" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none"><span style="width: 30px; height: 30px; border-radius: 100px; background: #F4F0EA; color: #000000; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">RB</span></a>
<button type="button" aria-label="Open menu" style="width: 44px; height: 44px; box-sizing: border-box; border: 1px solid #333333; border-radius: 100px; background: #000000; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg></button>
</header>

<main style="flex-grow: 1; box-sizing: border-box; padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: Newsreader, serif; font-weight: 400; font-size: 32px; line-height: 1.05">Audit log</h1>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #535353">Every sign-in, change, signature and download. Append-only — nobody can edit or delete an entry.</p>
</div>

<div style="height: 48px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #cfc7ba; border-radius: 100px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#535353" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="search" aria-label="Search the audit log" placeholder="Ticket, person or what happened" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: Raleway, sans-serif; font-size: 16px">
</div>

<div style="display: flex; align-items: center; gap: 8px">
<div role="radiogroup" aria-label="Source" style="display: inline-flex; gap: 3px; padding: 3px; background: #FFFFFF; border: 1px solid #dcd4c7; border-radius: 100px">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{s.on}}" style="{{s.style}}">{{s.label}}</button>
</sc-for>
</div>
<button type="button" aria-haspopup="dialog" style="margin-left: auto; height: 44px; padding: 0 14px; border: 1px solid #000000; border-radius: 100px; background: transparent; font-family: Raleway, sans-serif; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filters · 2</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
<button type="button" aria-label="Remove filter: {{c}}" style="height: 34px; padding: 0 8px 0 12px; border: none; border-radius: 100px; background: #000000; color: #FFFFFF; font-family: Raleway, sans-serif; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px">{{c}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</sc-for>
</div>
<span role="status" style="font-size: 12px; color: #535353">48 events · newest first · times in Dubai</span>

<sc-for list="{{days}}" as="d" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #535353">{{d.day}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #dcd4c7; border-radius: 14px">
<sc-for list="{{d.events}}" as="e" hint-placeholder-count="3">
<li style="border-bottom: 1px solid #ece6db">
<button type="button" aria-haspopup="dialog" style="width: 100%; min-height: 64px; box-sizing: border-box; padding: 10px 14px; border: none; background: transparent; display: flex; align-items: flex-start; gap: 10px; text-align: left; font-family: Raleway, sans-serif; color: #000000">
<span aria-hidden="true" style="{{e.avatar}}">{{e.initials}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 14px; line-height: 1.35"><strong>{{e.who}}</strong> {{e.what}}</span>
<span style="font-size: 12px; color: #535353">{{e.meta}}</span>
</span>
<span style="{{e.chipStyle}}">{{e.chip}}</span>
</button>
</li>
</sc-for>
</ul>
</section>
</sc-for>

<button type="button" style="height: 44px; border: none; background: transparent; font-family: Raleway, sans-serif; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">Show 30 more</button>

<div style="padding: 14px; background: #FFFFFF; border: 1px solid #dcd4c7; border-radius: 14px; display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 48px; border: 1px solid #000000; border-radius: 100px; background: transparent; font-family: Raleway, sans-serif; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>Export these 48 events (CSV)</button>
<span style="font-size: 12px; line-height: 1.5; color: #535353; text-align: center">The export follows the filters above and is itself recorded in the audit log.</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
renderVals() {
const pill = (label, on) => ({ label: label, on: on ? 'true' : 'false',
  style: 'height: 36px; padding: 0 12px; border: none; border-radius: 100px; font-family: Raleway, sans-serif; font-size: 13px; ' + (on ? 'background: #000000; color: #FFFFFF; font-weight: 600' : 'background: transparent; color: #000000; font-weight: 500') });
const chip = (kind) => ({
  chip: kind,
  chipStyle: 'flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 100px; ' +
    (kind === 'System' ? 'background: #ece6db; color: #535353' : kind === 'AI' ? 'background: #f3e7a8; color: #000000' : 'border: 1px solid #000000')
});
const ev = (initials, who, what, meta, kind) => Object.assign({
  initials: initials, who: who, what: what, meta: meta,
  avatar: 'width: 32px; height: 32px; flex-shrink: 0; border-radius: 100px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; ' +
    (kind === 'System' ? 'background: #ece6db; color: #535353' : 'background: #000000; color: #FFFFFF')
}, chip(kind));
return {
  sources: [pill('All', true), pill('People', false), pill('AI', false), pill('System', false)],
  chips: ['Last 7 days', 'Hiding test users'],
  days: [
    { day: 'Today · 15 Oct 2026', events: [
      ev('ML', 'Moises Larez', 'downloaded anna.keller-access-modification.pdf', '16:07 · UAM-2026-000141', 'People'),
      ev('SY', 'System', "updated Anna Keller's access inventory — 1 added, 2 ended", '16:05 · UAM-2026-000141', 'System'),
      ev('ML', 'Moises Larez', 'confirmed, signed and closed UAM-2026-000141', '16:05 · Access change · Anna Keller', 'People'),
      ev('RB', 'Raju Bholani', 'signed UAM-2026-000141 (Review & sign)', '14:12 · fingerprint 5d20a9e1…', 'People'),
      ev('RB', 'Raju Bholani', 'changed Figma on UAM-2026-000141 — Editor → Admin', '10:48 · section 5', 'People')
    ]},
    { day: 'Yesterday · 14 Oct 2026', events: [
      ev('RB', 'Raju Bholani', 'retired the application “Old CRM”', '17:20 · Admin → Applications', 'People'),
      ev('ML', 'Moises Larez', 'signed in', '09:02 · new device code', 'People'),
      ev('RB', 'Raju Bholani', 'started the access change UAM-2026-000141 for Anna Keller', '08:55 · 12 items on record', 'People')
    ]}
  ]
};
}
}
</script>
</body>
</html>
