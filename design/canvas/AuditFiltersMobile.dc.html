<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audit log filters · Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Raleway:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Raleway,sans-serif;color:#000000;background:#F4F0EA}
a{color:#000000}a:hover{color:#cf2e2e}
</style>
</helmet>
<div style="width: 390px; height: 960px; position: relative; font-family: Raleway, sans-serif; background: rgba(0,0,0,0.45); color: #000000">
<div role="dialog" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 40px; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
<div style="padding: 10px 16px 0; display: flex; justify-content: center"><span style="width: 40px; height: 4px; border-radius: 100px; background: #dcd4c7"></span></div>
<div style="padding: 12px 16px 8px; display: flex; align-items: flex-start; gap: 12px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #535353">Audit log</span>
<h2 id="sheet-title" style="margin: 0; font-family: Newsreader, serif; font-weight: 400; font-size: 26px">Filters</h2>
</div>
<button type="button" aria-label="Close" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="flex-grow: 1; overflow: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="who" style="font-size: 13px; font-weight: 600">Who</label>
<select id="who" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #cfc7ba; border-radius: 10px; background: #FFFFFF; font-family: Raleway, sans-serif; font-size: 16px"><option>Everyone</option><option>Raju Bholani</option><option>Moises Larez</option><option>Celine</option><option>System</option></select>
</div>

<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0 0 8px; font-size: 13px; font-weight: 600">What happened</legend>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<label style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid #dcd4c7; border-radius: 12px">
<input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #000000; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{g.label}}</span><span style="font-size: 12px; line-height: 1.4; color: #535353">{{g.note}}</span></span>
</label>
</sc-for>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0 0 8px; font-size: 13px; font-weight: 600">When</legend>
<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 3px; background: #F4F0EA; border-radius: 100px">
<sc-for list="{{periods}}" as="p" hint-placeholder-count="4">
<label style="{{p.style}}"><input type="radio" name="period" style="position: absolute; opacity: 0; width: 1px; height: 1px">{{p.label}}</label>
</sc-for>
</div>
<span style="font-size: 12px; color: #535353">Or pick dates: from <u>1 Oct 2026</u> to <u>15 Oct 2026</u></span>
</fieldset>

<label style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: #F4F0EA; border-radius: 12px">
<input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #000000; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Hide the test users</span><span style="font-size: 12px; line-height: 1.4; color: #535353">The automatic browser tests sign in many times a day. Their entries are kept but hidden.</span></span>
</label>
</div>

<div style="padding: 12px 16px 20px; border-top: 1px solid #dcd4c7; display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px">
<button type="button" style="height: 48px; border: 1px solid #000000; border-radius: 100px; background: transparent; font-family: Raleway, sans-serif; font-size: 15px; font-weight: 600">Clear all</button>
<button type="button" style="height: 48px; border: none; border-radius: 100px; background: #000000; color: #FFFFFF; font-family: Raleway, sans-serif; font-size: 15px; font-weight: 600">Show 48 events</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const seg = (label, on) => ({ label: label,
  style: 'position: relative; height: 44px; border-radius: 100px; display: flex; align-items: center; justify-content: center; font-size: 13px; ' + (on ? 'background: #000000; color: #FFFFFF; font-weight: 700' : 'font-weight: 500') });
return {
  groups: [
    { label: 'Requests', note: 'Created, details changed, apps / devices / access, started, cancelled' },
    { label: 'Signatures & approvals', note: 'Review & sign, confirmed, returned, signature uploads' },
    { label: 'Records & PDFs', note: 'PDF made, downloads, previews, exports' },
    { label: 'Admin & catalog', note: 'Applications, types, settings, users and roles' },
    { label: 'Sign-in & accounts', note: 'Sign-in, sign-out, password, authenticator, timezone' }
  ],
  periods: [seg('Today', false), seg('7 days', true), seg('30 days', false), seg('All', false)]
};
}
}
</script>
</body>
</html>
