<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Replace signature · Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Raleway:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Raleway,sans-serif;color:#000000;background:#F4F0EA}
a{color:#000000}a:hover{color:#cf2e2e}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Raleway, sans-serif; background: #F4F0EA; color: #000000">

<header style="height: 56px; box-sizing: border-box; padding: 0 8px 0 16px; background: #000000; display: flex; align-items: center; gap: 12px; color: #FFFFFF">
<img src="/_blob/17b23c9ce6dc5f048942c7b514470f03" alt="Laine" style="width: 60px; height: 22px; display: block; flex-shrink: 0">
<div style="width: 1px; height: 18px; background: #333333; flex-shrink: 0"></div>
<span style="flex-grow: 1; font-family: Newsreader, serif; font-size: 16px">Onboarding rights</span>
</header>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="height: 200px; background: #FFFFFF; border-radius: 14px"></div>
</div>

<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.45)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="up-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 16px 24px; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 100px; background: #cfc7ba"></span>
<div style="display: flex; align-items: flex-start; gap: 12px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #535353">Signature &amp; initials</span>
<h2 id="up-title" style="margin: 0; font-family: Newsreader, serif; font-weight: 400; font-size: 28px; line-height: 1.1">Replace signature</h2>
</div>
<button type="button" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid #dcd4c7; border-radius: 100px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</button>
</div>

<label for="sig-file" style="height: 120px; box-sizing: border-box; border: 1.5px dashed #000000; border-radius: 12px; background: #F4F0EA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 34px">[new signature preview]</span>
<span style="font-size: 12px; color: #535353">signature.png · 84 KB · 640 × 200 px</span>
</label>
<input id="sig-file" type="file" accept="image/png" style="position: absolute; width: 1px; height: 1px; opacity: 0">
<button type="button" style="height: 44px; border: 1px solid #000000; border-radius: 100px; background: transparent; font-family: Raleway, sans-serif; font-size: 14px; font-weight: 600; color: #000000">Choose another PNG</button>

<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{checks}}" as="c" hint-placeholder-count="3">
<li style="display: flex; gap: 10px; align-items: center; font-size: 14px">
<span aria-hidden="true" style="width: 18px; height: 18px; flex-shrink: 0; border-radius: 100px; background: #000000; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span>{{c}}</span>
</li>
</sc-for>
</ul>
<p style="margin: 0; padding: 10px 12px; background: #F4F0EA; border-radius: 10px; font-size: 13px; line-height: 1.5; color: #535353">It becomes your active signature. The old one stays in History, so past records keep the signature used at the time.</p>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<button type="button" style="height: 48px; border: 1px solid #000000; border-radius: 100px; background: transparent; font-family: Raleway, sans-serif; font-size: 15px; font-weight: 600; color: #000000">Cancel</button>
<button type="button" style="height: 48px; border: none; border-radius: 100px; background: #000000; font-family: Raleway, sans-serif; font-size: 15px; font-weight: 600; color: #FFFFFF">Save as active</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
checks: ['PNG image', 'Under 1 MB', 'At least 300 × 100 px — transparent background recommended']
};
}
}
</script>
</body>
</html>
