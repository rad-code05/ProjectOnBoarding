<div style="width: 1440px; height: 1100px; display: flex; flex-direction: column; font-family: Raleway, sans-serif; background: #F4F0EA; color: #000000">

<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #535353">UAM-2026-000124 · Onboarding · Read-only</span>
<div style="display: flex; align-items: center; gap: 12px"><h1 style="margin: 0; font-family: Newsreader, serif; font-weight: 400; font-size: 32px">Anna Keller</h1><span style="font-size: 11px; font-weight: 600; padding: 3px 10px; background: #f9e4b4; border-radius: 100px">Awaiting your confirmation</span></div>
</div>
<div style="display: flex; gap: 8px">

<a href="ConfirmSign.dc.html" style="height: 40px; box-sizing: border-box; padding: 0 18px; border-radius: 100px; background: #000000; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Confirm &amp; sign</a>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
<section style="background: #FFFFFF; border: 1px solid #dcd4c7; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 11px; font-weight: 600; color: #535353">{{c.num}}</span><h2 style="margin: 0; font-family: Newsreader, serif; font-weight: 400; font-size: 18px">{{c.title}}</h2></div>
<div style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 10px; font-size: 12px">
<sc-for list="{{c.rows}}" as="r" hint-placeholder-count="4"><span style="color: #535353">{{r.k}}</span><span>{{r.v}}</span></sc-for>
</div>
</section>
</sc-for>
</div>
<p style="margin: 0; font-size: 11px; color: #535353">Approvers see every section but can't edit. Sections that don't apply (e.g. SLA on onboarding) are hidden.</p>
</main>
</div>
</x-dc>
