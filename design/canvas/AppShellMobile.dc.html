<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App shell · Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Raleway:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Raleway,sans-serif;color:#000000;background:#F4F0EA}
a{color:#000000}a:hover{color:#cf2e2e}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; font-family: Raleway, sans-serif; background: #F4F0EA; color: #000000">

<header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 16px; background: #000000; display: flex; align-items: center; gap: 12px; color: #FFFFFF">
<img src="/_blob/17b23c9ce6dc5f048942c7b514470f03" alt="Laine" style="width: 60px; height: 22px; display: block; flex-shrink: 0">
<div style="width: 1px; height: 18px; background: #333333; flex-shrink: 0"></div>
<span style="flex-grow: 1; min-width: 0; font-family: Newsreader, serif; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Onboarding rights</span>
<a href="Profile.dc.html" aria-label="My profile: {{userName}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
<span style="width: 30px; height: 30px; border-radius: 100px; background: #F4F0EA; color: #000000; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">{{initials}}</span>
</a>
<button type="button" aria-label="Open menu" aria-expanded="false" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border: 1px solid #333333; border-radius: 100px; background: #000000; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
</button>
</header>

<main style="flex-grow: 1; box-sizing: border-box; padding: 28px 16px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #535353">{{section}}</span>
<h1 style="margin: 0; font-family: Newsreader, serif; font-weight: 400; font-size: 34px; line-height: 1.05; letter-spacing: -0.01em">{{page}}</h1>
<div style="width: 48px; height: 3px; background: #cf2e2e"></div>
<p style="margin: 0; font-size: 14px; line-height: 1.55; color: #535353">{{description}}</p>
<p style="margin: 0; font-size: 12px; color: #535353">Coming with {{feature}}.</p>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["admin","approver"],"default":"admin"},"userName":{"editor":"text","default":"Raju Bholani"},"initials":{"editor":"text","default":"RB"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const approver = (this.props.role ?? 'admin') === 'approver';
return {
userName: this.props.userName ?? (approver ? 'Moises Larez' : 'Raju Bholani'),
initials: this.props.initials ?? (approver ? 'ML' : 'RB'),
section: 'Laine onboarding rights',
page: approver ? 'Approvals' : 'Requests',
description: approver
? 'Requests Raju has signed that are waiting for your confirmation.'
: 'Everyone being onboarded, offboarded or changed, with New request and Batch onboarding.',
feature: approver ? 'F07' : 'F01'
};
}
}
</script>
</body>
</html>
