<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Equipment return · Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Raleway:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Raleway,sans-serif;color:#000000;background:#F4F0EA}
a{color:#000000}a:hover{color:#cf2e2e}
textarea::placeholder{color:#7e7e7e}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; font-family: Raleway, sans-serif; background: rgba(0,0,0,0.45); color: #000000">

<div role="dialog" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 96px; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
<div style="padding: 10px 16px 0; display: flex; justify-content: center"><span style="width: 40px; height: 4px; border-radius: 100px; background: #dcd4c7"></span></div>
<div style="padding: 12px 16px 8px; display: flex; align-items: flex-start; gap: 12px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #535353">06 · Equipment to return</span>
<h2 id="sheet-title" style="margin: 0; font-family: Newsreader, serif; font-weight: 400; font-size: 26px">Laptop · macOS</h2>
<span style="font-size: 13px; color: #535353">Asset [asset tag] · issued on UAM-2026-000098</span>
</div>
<button type="button" aria-label="Close" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="flex-grow: 1; overflow: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0 0 6px; font-size: 13px; font-weight: 600">Status</legend>
<sc-for list="{{states}}" as="s" hint-placeholder-count="3">
<label style="{{s.box}}">
<sc-if value="{{s.on}}" hint-placeholder-val="{{false}}"><input type="radio" name="st" checked style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #000000; flex-shrink: 0"></sc-if><sc-if value="{{s.off}}" hint-placeholder-val="{{true}}"><input type="radio" name="st" style="width: 22px; height: 22px; margin: 1px 0 0; accent-color: #000000; flex-shrink: 0"></sc-if>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{s.label}}</span><span style="font-size: 12px; line-height: 1.4; color: #535353">{{s.help}}</span></span>
</label>
</sc-for>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="why" style="font-size: 13px; font-weight: 600">What happened? <span style="color: #cf2e2e">*</span></label>
<textarea id="why" rows="3" aria-describedby="why-help" style="box-sizing: border-box; padding: 10px 12px; border: 1px solid #cfc7ba; border-radius: 10px; font-family: Raleway, sans-serif; font-size: 16px; line-height: 1.4; resize: none; color: #000000">Courier lost the parcel; claim [claim no.] opened with the carrier. Device locked and wiped remotely in Hexnode.</textarea>
<span id="why-help" style="font-size: 12px; color: #535353">Required for “Not returned”. Shown on the record and the PDF.</span>
</div>

<div style="padding: 12px 14px; background: #F4F0EA; border-radius: 12px; font-size: 12px; line-height: 1.5; color: #535353">Equipment returns don't count towards the access removal SLA — shipping can take days. The date is recorded by the system when you save.</div>
</div>

<div style="padding: 12px 16px 20px; border-top: 1px solid #dcd4c7; display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px">
<button type="button" style="height: 48px; border: 1px solid #000000; border-radius: 100px; background: transparent; font-family: Raleway, sans-serif; font-size: 15px; font-weight: 600">Cancel</button>
<button type="button" style="height: 48px; border: none; border-radius: 100px; background: #000000; color: #FFFFFF; font-family: Raleway, sans-serif; font-size: 15px; font-weight: 600">Save</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = (label, help, on) => ({
label: label, help: help, on: on, off: !on,
box: 'display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; ' + (on ? 'border: 2px solid #000000' : 'border: 1px solid #cfc7ba')
});
return {
states: [
st('Return pending', 'Still with Marco or on its way.', false),
st('Received', 'Back with IT. Date and time recorded now.', false),
st('Not returned', 'Lost, kept or written off — say why below.', true)
]
};
}
}
</script>
</body>
</html>
